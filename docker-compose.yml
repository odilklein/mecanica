services:
  db:
    image: docker.io/library/mysql:8.4
    container_name: mecanica-db
    restart: "no"
    environment:
      # DB_PASS é obrigatório (defina no .env). Sem porta publicada o banco
      # só é alcançável pela rede interna do compose.
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
      MYSQL_DATABASE: ${DB_NAME:-mecanica}
      MYSQL_USER: ${DB_USER:-mecanica}
      MYSQL_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
    volumes:
      - db_data:/var/lib/mysql
      # O schema é criado pelas migrations:
      # docker compose exec app php bin/migrate.php migrate
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:?defina DB_PASS no .env}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: mecanica-app
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-mecanica}
      DB_PASS: ${DB_PASS:?defina DB_PASS no .env}
      DB_NAME: ${DB_NAME:-mecanica}
    volumes:
      # Reflete o código do workspace no container (dev em tempo real)
      - ./:/var/www/html:Z

  # phpMyAdmin fica fora do `up` padrão e só escuta em localhost.
  # Uso: docker compose --profile dev up -d phpmyadmin
  phpmyadmin:
    image: docker.io/phpmyadmin:latest
    container_name: mecanica-phpmyadmin
    profiles: ["dev"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M

volumes:
  db_data:
