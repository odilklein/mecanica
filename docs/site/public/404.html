<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Página não encontrada · Torque</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f7f3ec;
      color: #2b2320;
    }
    main { max-width: 34rem; text-align: center; }
    .code { font-size: 5rem; font-weight: 800; line-height: 1; color: #b8270f; }
    h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
    p { line-height: 1.6; color: #5c4f49; margin: 0 0 1.5rem; }
    a {
      display: inline-block;
      padding: 0.7rem 1.2rem;
      border-radius: 0.5rem;
      background: #b8270f;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #94200c; }
    @media (prefers-color-scheme: dark) {
      body { background: #1f1b19; color: #f3ece5; }
      p { color: #cbbfb6; }
    }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>
      O endereço não existe ou foi movido. A documentação do Torque continua
      disponível na página inicial.
    </p>
    <a href="/">Voltar para a documentação</a>
  </main>
</body>
</html>
